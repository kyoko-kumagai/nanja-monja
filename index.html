<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nanmon Ultimate - Mobile Fixed</title>
    <style>
        body {
            background: radial-gradient(circle, #1a1c2c 0%, #020205 100%);
            color: white; font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            /* ↓ 画面の「見えている範囲」いっぱいに高さを固定する修正 */
            height: 100dvh; 
            margin: 0; overflow: hidden;
        }
        canvas {
            width: 100%; height: auto; flex-grow: 1;
            display: none;
        }
        #titleScreen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('image.png') no-repeat center center;
            background-size: cover;
            display: flex; flex-direction: column; justify-content: flex-end;
            align-items: center; z-index: 100;
        }
        #ui {
            padding-bottom: 20px; /* 余白を少し詰めました */
            width: 100%; display: none; justify-content: center;
            z-index: 10;
        }
        .mainBtn {
            padding: 16px 40px; font-size: 20px; font-weight: bold;
            border-radius: 50px; border: none; 
            background: linear-gradient(45deg, #d4af37, #f9f295, #d4af37);
            color: #4a3500; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: transform 0.1s;
            margin-bottom: env(safe-area-inset-bottom, 20px); /* iPhoneの下部バー対策 */
            cursor: pointer;
        }
        .mainBtn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div id="titleScreen">
    <button id="startBtn" class="mainBtn">スタート</button>
</div>

<canvas id="gameCanvas"></canvas>

<div id="ui">
    <button id="drawBtn" class="mainBtn">カードをめくる</button>
</div>

<script>
    // --- 既存のJavaScript（そのまま） ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const drawBtn = document.getElementById('drawBtn');
    const startBtn = document.getElementById('startBtn');
    const titleScreen = document.getElementById('titleScreen');
    const ui = document.getElementById('ui');

    const dpr = window.devicePixelRatio || 1;
    function resize() {
        canvas.width = window.innerWidth * dpr;
        // 下のUI（ボタン）分を引いた高さを計算
        canvas.height = (window.innerHeight - 100) * dpr;
        ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    const IMAGES_COUNT = 12;
    const COPIES = 5;
    const creatureImages = [];
    for (let i = 1; i <= IMAGES_COUNT; i++) {
        const img = new Image();
        img.src = `${i}.png`; 
        creatureImages.push(img);
    }

    let deck = [];
    let currentCard = null;
    let persistentHistory = new Set(); 
    let observationCount = 0;
    let isGameOver = false;
    let nextDrawResets = false;
    let flipRotation = 0; 
    let isAnimating = false;

    startBtn.onclick = () => {
        titleScreen.style.display = 'none';
        canvas.style.display = 'block';
        ui.style.display = 'flex';
        initGame();
        update();
    };

    function initGame() {
        deck = [];
        for (let i = 1; i <= IMAGES_COUNT; i++) {
            for (let j = 0; j < COPIES; j++) deck.push(i);
        }
        shuffle(deck);
        persistentHistory.clear();
        observationCount = 0;
        currentCard = null;
        isGameOver = false;
        nextDrawResets = false;
        drawBtn.innerText = "カードをめくる";
        drawBtn.disabled = false;
    }

    function shuffle(a) {
        for(let i=a.length-1; i>0; i--){
            const j = Math.floor(Math.random()*(i+1));
            [a[i], a[j]] = [a[j], a[i]];
        }
    }

    function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const centerX = window.innerWidth / 2;
        const centerY = (window.innerHeight - 100) / 2;

        if (deck.length > 0) {
            ctx.save();
            ctx.fillStyle = "#1e293b";
            ctx.strokeStyle = "#d4af37";
            ctx.lineWidth = 1;
            const deckW = 80, deckH = 110;
            for(let i=0; i<Math.min(deck.length, 3); i++) {
                ctx.beginPath();
                ctx.roundRect(centerX - deckW/2 - i*2, centerY - deckH/2 - i*2, deckW, deckH, 8);
                ctx.fill();
                ctx.stroke();
            }
            ctx.restore();
        }

        if (currentCard) {
            if (isAnimating) {
                flipRotation += 0.12; 
                if (flipRotation >= Math.PI) {
                    flipRotation = Math.PI;
                    isAnimating = false;
                    drawBtn.disabled = false;
                }
            }

            const img = creatureImages[currentCard - 1];
            if (img.complete) {
                const maxDisplayW = window.innerWidth * 0.85;
                const ratio = Math.min(maxDisplayW / img.width, (window.innerHeight - 200) / img.height);
                const nw = img.width * ratio;
                const nh = img.height * ratio;

                ctx.save();
                ctx.translate(centerX, centerY);
                const scaleX = Math.abs(Math.cos(flipRotation));
                ctx.scale(scaleX, 1);

                if (Math.cos(flipRotation) > 0) {
                    ctx.fillStyle = "#1e293b";
                    ctx.strokeStyle = "#d4af37";
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.roundRect(-nw/2, -nh/2, nw, nh, 20);
                    ctx.fill();
                    ctx.stroke();
                } else {
                    ctx.shadowBlur = 30;
                    ctx.shadowColor = "rgba(212, 175, 55, 0.5)";
                    ctx.drawImage(img, -nw/2, -nh/2, nw, nh);
                    const goldGrad = ctx.createLinearGradient(-nw/2, -nh/2, nw/2, nh/2);
                    goldGrad.addColorStop(0, '#d4af37');
                    goldGrad.addColorStop(0.5, '#f9f295');
                    goldGrad.addColorStop(1, '#d4af37');
                    ctx.strokeStyle = goldGrad;
                    ctx.lineWidth = 6;
                    ctx.strokeRect(-nw/2, -nh/2, nw, nh);
                }
                ctx.restore();
            }
        }

        if (observationCount > 0) {
            ctx.save();
            const posX = window.innerWidth - 45;
            const posY = 45;
            const radius = 24;
            ctx.beginPath();
            ctx.arc(posX, posY, radius + 2, 0, Math.PI * 2);
            ctx.fillStyle = "#d4af37";
            ctx.fill();
            ctx.beginPath();
            ctx.arc(posX, posY, radius, 0, Math.PI * 2);
            ctx.fillStyle = "white";
            ctx.fill();
            ctx.fillStyle = "#1a1c2c";
            ctx.font = "bold 28px sans-serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(observationCount, posX, posY + 1);
            ctx.restore();
        }

        if (isGameOver && !isAnimating) {
            ctx.fillStyle = "rgba(0,0,0,0.85)";
            ctx.fillRect(0,0, canvas.width, canvas.height);
            ctx.fillStyle = "#f9f295";
            ctx.textAlign = "center";
            ctx.font = "bold 36px sans-serif";
            ctx.fillText("COMPLETE!", centerX, centerY);
        }

        requestAnimationFrame(update);
    }

    drawBtn.onclick = () => {
        if (isGameOver) { initGame(); return; }
        if (deck.length === 0 || isAnimating) return;

        if (nextDrawResets) {
            observationCount = 1;
            nextDrawResets = false;
        } else {
            observationCount++;
        }

        const nextCardId = deck.pop();
        if (persistentHistory.has(nextCardId)) {
            nextDrawResets = true;
        }
        persistentHistory.add(nextCardId);
        
        currentCard = nextCardId;
        flipRotation = 0;
        isAnimating = true;
        drawBtn.disabled = true;

        if (deck.length === 0) {
            isGameOver = true;
            drawBtn.innerText = "もう一度遊ぶ";
        }
    };
</script>
</body>
</html>
